name: "🐳 Build & 🚚 Release"

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Releases the staging evaluator on the kontestis K3s cluster. Production
# evaluation runs on an offsite worker and is not touched by this workflow.
env:
  IMAGE: ghcr.io/itklubbozolagan/kontestis-evaluator-rs
  NAMESPACE: kontestis-evaluator-staging
  DEPLOYMENT: evaluator-staging
  CONTAINER: evaluator

concurrency:
  group: build-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: "🐳 Build"
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build crate
        run: cargo build --release

      - id: auth
        name: Autenticate with GCP
        uses: google-github-actions/auth@v1
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/953907026294/locations/global/workloadIdentityPools/kontestis-actions/providers/kontestis-provider"
          service_account: "github-actions@speedy-baton-368023.iam.gserviceaccount.com"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GCP container registry
        uses: docker/login-action@v2
        with:
          registry: eu.gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Login to GitHub container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          tags: |
            eu.gcr.io/speedy-baton-368023/kontestis-evaluator-rs:latest
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
  release:
    name: "🚚 Release"
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - name: "Set up kubectl"
        uses: azure/setup-kubectl@v3

      - name: "Copy kubernetes config"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          install -m 700 -d ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: "Roll out the new image"
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          kubectl -n "$NAMESPACE" set image "deployment/$DEPLOYMENT" "$CONTAINER=$IMAGE@$IMAGE_DIGEST"
          kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=300s
